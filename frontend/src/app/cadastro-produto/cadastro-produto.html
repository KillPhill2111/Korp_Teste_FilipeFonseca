<div class="container-cadastro">
  <h2>📦 Cadastro de Produto</h2>
  
  <form [formGroup]="produtoForm" (ngSubmit)="salvarProduto()">
    
    
    <div class="form-group">
      <label for="descricao">Descrição (Nome do Produto)</label>
      <div style="display: flex; gap: 10px; align-items: center;">
        <input type="text" id="descricao" formControlName="descricao" placeholder="Ex: Arroz Integral Camil 1kg" style="flex: 1; margin: 0;">
    
        <button type="button" (click)="sugerirCodigoComIA()" style="background-color: #6f42c1; color: white; border: none; padding: 12px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; white-space: nowrap; height: 46px; transition: background 0.2s;" onmouseover="this.style.backgroundColor='#5a32a3'" onmouseout="this.style.backgroundColor='#6f42c1'">
          🤖 Usar IA
        </button>
      </div>
      <small class="error-message" *ngIf="produtoForm.get('descricao')?.touched && produtoForm.get('descricao')?.errors?.['required']">
        ⚠️ A descrição é obrigatória.
      </small>
      <small class="error-message" *ngIf="produtoForm.get('descricao')?.touched && produtoForm.get('descricao')?.errors?.['minlength']">
        ⚠️ A descrição deve ter pelo menos 3 caracteres.
      </small>
    </div>

    
    <div class="form-group">
      <label for="codigo">Código do Produto (SKU)</label>
      <input type="text" id="codigo" formControlName="codigo" placeholder="Ex: ALIM-ARR-INT">
      <small class="error-message" *ngIf="produtoForm.get('codigo')?.touched && produtoForm.get('codigo')?.errors?.['required']">
        ⚠️ O código do produto é obrigatório.
      </small>
    </div>

    
    <div class="form-group">
      <label for="saldo">Saldo em Estoque Inicial</label>
      <input type="number" id="saldo" formControlName="saldo">
      <small class="error-message" *ngIf="produtoForm.get('saldo')?.touched && produtoForm.get('saldo')?.errors?.['min']">
        ⚠️ O estoque inicial não pode ser negativo.
      </small>
    </div>

    
    <button type="submit" class="btn-enviar" [disabled]="produtoForm.invalid">
      Cadastrar Produto
    </button>

  </form>
</div>
