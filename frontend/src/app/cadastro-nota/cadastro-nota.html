<div class="container-nota">
  <h2>🧾 Cadastro de Nota Fiscal</h2>

  <form [formGroup]="notaForm" (ngSubmit)="salvarNota()">
    
    <div class="nota-header">
      <div class="form-group-metade">
        <label>Numeração Sequencial</label>
        <input type="text" formControlName="numeracao" class="input-disabled">
      </div>
      <div class="form-group-metade">
        <label>Status Inicial</label>
        <input type="text" formControlName="status" class="input-disabled status-aberta">
      </div>
    </div>

    <hr class="divisor-interno">

    <h3> Produtos da Nota</h3>
    
    <div formArrayName="produtos">
      <div *ngFor="let item of listaProdutos.controls; let i = index" [formGroupName]="i" class="produto-linha">
        
        <div class="campo-selecao">
          <label>Produto</label>
          
          <select formControlName="codigoProduto">
            <option value="" disabled selected>Selecione um produto real do estoque...</option>
            <!-- O [value]="prod.codigo" garante que o Angular envie apenas o código (ex: AZ-001) para o C# -->
            <option *ngFor="let prod of produtosDisponiveis" [value]="prod.codigo">
              {{ prod.descricao }} (Código: {{ prod.codigo }} | Saldo Atual: {{ prod.saldo }})
            </option>
          </select>
        </div>

        <div class="campo-quantidade">
          <label>Qtd</label>
          <input type="number" formControlName="quantidade">
        </div>

        <div class="campo-remover">
          <label>&nbsp;</label>
          <button type="button" class="btn-remover" (click)="removerProduto(i)" [disabled]="listaProdutos.length === 1">
            🗑️
          </button>
        </div>

      </div>
    </div>

    <button type="button" class="btn-adicionar" (click)="adicionarProduto()">
      ➕ Adicionar Outro Produto
    </button>

    <button type="submit" class="btn-salvar" [disabled]="notaForm.invalid || listaProdutos.length === 0">
      Salvar Nota Fiscal
    </button>

  </form>

  <hr class="divisor-interno">

  <h3> Notas Fiscais Emitidas (Faturamento)</h3>
  <div class="tabela-container">
    <table class="tabela-notas">
      <thead>
        <tr>
          <th>Número</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let nota of notasFiscaisCriadas">
          <td><strong>{{ nota.numeracao }}</strong></td>
          <td>
            <span class="badge" [ngClass]="nota.status === 'Aberta' ? 'badge-aberta' : 'badge-fechada'">
              {{ nota.status }}
            </span>
          </td>
          <td>
            <button 
              class="btn-imprimir" 
              (click)="imprimirNota(nota)" 
              [disabled]="nota.status !== 'Aberta' || processandoImpressao">
              
              <span *ngIf="processandoImpressao && notaSendoProcessada === nota.numeracao" class="spinner">⏳ Processando...</span>
              <span *ngIf="!(processandoImpressao && notaSendoProcessada === nota.numeracao)">🖨️ Imprimir</span>
              
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
